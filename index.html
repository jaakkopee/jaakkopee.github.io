<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>jaakkopee.github.io</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <header class="hero">
        <p class="eyebrow">Dynamic System Study</p>
        <h1>Diffusing Cell Automaton</h1>
        <p class="lead">
          1024 colored cells diffuse and modulate one another while random spline projections repeatedly knock the system out of equilibrium.
        </p>
      </header>

      <section class="automaton-panel" aria-label="Animated automaton">
        <canvas id="automatonCanvas" width="640" height="640" aria-label="Diffusing color automaton"></canvas>
      </section>

      <footer class="site-footer">
        <small id="statusText">Stabilizing toward equilibrium...</small>
      </footer>
    </main>

    <script src="script.js"></script>
  </body>
</html>
